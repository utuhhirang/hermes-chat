<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenCode Chat</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; height: 100vh; display: flex; background: #0f1115; color: #e6e6e6; }
  #sidebar { width: 280px; background: #171a21; border-right: 1px solid #262b36; display: flex; flex-direction: column; }
  #sidebar header { padding: 14px; display: flex; gap: 8px; }
  #sidebar button { flex: 1; padding: 8px; background: #2b6cb0; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #sessions { overflow-y: auto; flex: 1; }
  .sess { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #1e222b; }
  .sess:hover { background: #1e222b; }
  .sess.active { background: #263247; }
  .sess .t { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .d { font-size: 11px; color: #8a93a6; margin-top: 3px; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #log { flex: 1; overflow-y: auto; padding: 20px; }
  .msg { max-width: 780px; margin: 0 auto 14px; padding: 10px 14px; border-radius: 8px; white-space: pre-wrap; line-height: 1.5; }
  .msg.user { background: #263247; }
  .msg.assistant { background: #1b1f27; }
  .msg.error { background: #4a1f24; color: #ffb4b4; }
  .role { font-size: 11px; color: #8a93a6; margin-bottom: 4px; text-transform: uppercase; }
  #form { display: flex; gap: 8px; padding: 14px; border-top: 1px solid #262b36; }
  #input { flex: 1; resize: none; height: 56px; padding: 10px; background: #171a21; color: #e6e6e6; border: 1px solid #2a3040; border-radius: 6px; font: inherit; }
  #send { padding: 0 22px; background: #2b6cb0; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
  #title { padding: 12px 20px; border-bottom: 1px solid #262b36; font-size: 14px; color: #8a93a6; }
</style>
</head>
<body>
<aside id="sidebar">
  <header><button id="new">+ Chat baru</button></header>
  <div id="sessions"></div>
</aside>
<main id="main">
  <div id="title">Chat baru</div>
  <div id="log"></div>
  <form id="form">
    <textarea id="input" placeholder="Tulis pesan… (Enter kirim, Shift+Enter baris baru)"></textarea>
    <button id="send" type="submit">Kirim</button>
  </form>
</main>
<script>
let currentId = null;
let busy = false;
const $ = (s) => document.querySelector(s);

function fmtDate(ms) { return ms ? new Date(ms).toLocaleString('id-ID') : ''; }

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const r = document.createElement('div');
  r.className = 'role';
  r.textContent = role === 'user' ? 'Anda' : role === 'error' ? 'Error' : 'Asisten';
  const body = document.createElement('div');
  body.textContent = text;
  div.append(r, body);
  $('#log').append(div);
  $('#log').scrollTop = $('#log').scrollHeight;
  return body;
}

async function loadSessions() {
  const res = await fetch('/api/sessions');
  const list = await res.json();
  const box = $('#sessions');
  box.innerHTML = '';
  if (list.error) { box.textContent = list.error; return; }
  for (const s of list) {
    const el = document.createElement('div');
    el.className = 'sess' + (s.id === currentId ? ' active' : '');
    el.innerHTML = '';
    const t = document.createElement('div');
    t.className = 't';
    t.textContent = s.title;
    const d = document.createElement('div');
    d.className = 'd';
    d.textContent = fmtDate(s.updated);
    el.append(t, d);
    el.onclick = () => openSession(s.id, s.title);
    box.append(el);
  }
}

async function openSession(id, title) {
  currentId = id;
  $('#log').innerHTML = '';
  $('#title').textContent = title || id;
  const res = await fetch('/api/sessions/' + encodeURIComponent(id));
  const data = await res.json();
  if (data.error) { addMsg('error', data.error); return; }
  for (const m of data.messages) addMsg(m.role === 'user' ? 'user' : 'assistant', m.text);
  loadSessions();
}

function newChat() {
  currentId = null;
  $('#log').innerHTML = '';
  $('#title').textContent = 'Chat baru';
  loadSessions();
}

async function send(text) {
  busy = true;
  $('#send').disabled = true;
  addMsg('user', text);
  const out = addMsg('assistant', '');
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: currentId, message: text }),
    });
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i).trim();
        buf = buf.slice(i + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === 'session') { currentId = ev.session_id; }
        else if (ev.type === 'text') { out.textContent += ev.text; }
        else if (ev.type === 'error') { addMsg('error', ev.error); }
      }
    }
  } catch (e) {
    addMsg('error', String(e));
  }
  busy = false;
  $('#send').disabled = false;
  $('#title').textContent = currentId ? currentId : 'Chat baru';
  loadSessions();
}

$('#form').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = $('#input').value.trim();
  if (!text || busy) return;
  $('#input').value = '';
  send(text);
});
$('#input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#form').requestSubmit(); }
});
$('#new').onclick = newChat;

loadSessions();
</script>
</body>
</html>
